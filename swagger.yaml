        - feeds
    post:
      consumes:
        - application/json
      description: Subscribe to a valid RSS/Atom feed URL.
      parameters:
        - description: Subscribe request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/api.SubscribeRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/domain.Feed"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
