definitions:
  api.AuthResponse:
    properties:
      access_token:
        type: string
      email:
        type: string
      household_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      refresh_token:
        type: string
    type: object
  api.CollectionForm:
    properties:
      description:
        type: string
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  api.CreateInviteForm:
    properties:
      email:
        type: string
    type: object
  api.ForgotPasswordForm:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  api.ImportRequest:
    properties:
      update:
        type: boolean
      url:
        type: string
    required:
    - url
    type: object
  api.LoginForm:
    properties:
      email:
        minLength: 6
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  api.MealPlanForm:
    properties:
      date:
        example: "2024-12-25"
        format: date
        type: string
      description:
        type: string
      meal_type:
        enum:
        - breakfast
        - lunch
        - dinner
        example: dinner
        type: string
      recipe_id:
        type: string
      servings:
        example: 4
        minimum: 1
        type: integer
    required:
    - date
    - meal_type
    type: object
  api.RegisterForm:
    properties:
      email:
        minLength: 6
        type: string
      invite_code:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  api.RenewForm:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  api.ResetPasswordForm:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  api.ShoppingItemForm:
    properties:
      amount:
        example: 2
        type: number
      food_id:
        type: string
      text:
        example: 2 cups of milk
        type: string
      unit_id:
        type: string
    type: object
  api.ShoppingListForm:
    properties:
      name:
        example: Weekly Shop
        type: string
    required:
    - name
    type: object
  api.SubscribeRequest:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  api.UpdateCollectionForm:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.UpdateHouseholdForm:
    properties:
      name:
        minLength: 2
        type: string
    required:
    - name
    type: object
  api.UpdateMealPlanForm:
    properties:
      date:
        example: "2024-12-26"
        format: date
        type: string
      description:
        type: string
      meal_type:
        enum:
        - breakfast
        - lunch
        - dinner
        example: lunch
        type: string
      recipe_id:
        type: string
      servings:
        example: 2
        minimum: 1
        type: integer
    type: object
  api.UpdateShoppingItemForm:
    properties:
      amount:
        example: 1
        type: number
      is_bought:
        example: true
        type: boolean
      name:
        example: Organic Milk
        type: string
    type: object
  api.UpdateUserForm:
    properties:
      current_password:
        example: password123
        type: string
      email:
        example: john@example.com
        format: email
        minLength: 6
        type: string
      name:
        example: John Doe
        minLength: 2
        type: string
      new_password:
        example: newpassword123
        minLength: 8
        type: string
    type: object
  domain.Author:
    properties:
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      url:
        type: string
    type: object
  domain.Collection:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      total_recipes:
        type: integer
      user_id:
        type: string
    type: object
  domain.Equipment:
    properties:
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.Image'
        type: array
      name:
        type: string
      slug:
        type: string
    type: object
  domain.Feed:
    properties:
      active:
        type: boolean
      id:
        type: string
      last_sync_at:
        type: string
      last_sync_success:
        type: boolean
      name:
        type: string
      publisher:
        $ref: '#/definitions/domain.Publisher'
      publisher_id:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      total_recipes:
        type: integer
      url:
        type: string
    type: object
  domain.Food:
    properties:
      default_unit:
        $ref: '#/definitions/domain.Unit'
      default_unit_id:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      slug:
        type: string
      taxonomies:
        items:
          $ref: '#/definitions/domain.Taxonomy'
        type: array
    type: object
  domain.Household:
    properties:
      collections:
        items:
          $ref: '#/definitions/domain.Collection'
        type: array
      feeds:
        items:
          $ref: '#/definitions/domain.Feed'
        type: array
      id:
        type: string
      invites:
        items:
          $ref: '#/definitions/domain.UserToken'
        type: array
      members:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      name:
        type: string
      owner_id:
        type: string
      shopping_lists:
        items:
          $ref: '#/definitions/domain.ShoppingList'
        type: array
    type: object
  domain.Image:
    properties:
      caption:
        type: string
      content_type:
        type: string
      height:
        type: integer
      id:
        type: string
      order:
        type: integer
      size:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  domain.InviteInfo:
    properties:
      household_name:
        type: string
      inviter_name:
        type: string
    type: object
  domain.MealPlan:
    properties:
      date:
        type: string
      description:
        type: string
      id:
        type: string
      meal_type:
        description: breakfast, lunch, dinner
        type: string
      recipe:
        $ref: '#/definitions/domain.Recipe'
      recipe_id:
        type: string
      servings:
        type: integer
    type: object
  domain.Publisher:
    properties:
      description:
        type: string
      feeds:
        items:
          $ref: '#/definitions/domain.Feed'
        type: array
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      total_recipes:
        type: integer
      url:
        type: string
    type: object
  domain.Rating:
    properties:
      count:
        type: integer
      reviews:
        type: integer
      value:
        type: number
    type: object
  domain.Recipe:
    properties:
      author:
        $ref: '#/definitions/domain.Author'
      author_id:
        type: string
      collections:
        items:
          $ref: '#/definitions/domain.Collection'
        type: array
      cook_time:
        example: 1200
        type: integer
      description:
        example: A classic Italian pasta dish made with eggs, cheese, pancetta, and
          pepper.
        type: string
      difficulty:
        example: Medium
        type: string
      equipment:
        items:
          $ref: '#/definitions/domain.Equipment'
        type: array
      feed_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.Image'
        type: array
      ingredients:
        items:
          $ref: '#/definitions/domain.RecipeIngredient'
        type: array
      instructions:
        items:
          $ref: '#/definitions/domain.RecipeInstruction'
        type: array
      is_saved:
        type: boolean
      language:
        example: en
        type: string
      method:
        example: Stovetop
        type: string
      name:
        example: Spaghetti Carbonara
        type: string
      nutrition:
        $ref: '#/definitions/domain.RecipeNutrition'
      prep_time:
        example: 900
        type: integer
      published:
        format: date-time
        type: string
      publisher:
        $ref: '#/definitions/domain.Publisher'
      publisher_id:
        type: string
      rating:
        $ref: '#/definitions/domain.Rating'
      source_url:
        type: string
      taxonomies:
        items:
          $ref: '#/definitions/domain.Taxonomy'
        type: array
      text:
        type: string
      total_time:
        example: 2100
        type: integer
      url:
        type: string
      user_id:
        type: string
      video:
        $ref: '#/definitions/domain.Video'
      yield:
        example: 4
        type: integer
    type: object
  domain.RecipeIngredient:
    properties:
      amount:
        description: nil when unquantified (e.g. "to taste", "a pinch of")
        type: number
      category:
        description: Category groups ingredients into named sections within a recipe
          (e.g. "For the sauce", "For the dough").
        type: string
      description:
        description: Description holds preparation notes extracted from the ingredient
          string (e.g. "finely diced", "at room temperature").
        type: string
      food:
        $ref: '#/definitions/domain.Food'
      food_id:
        type: string
      id:
        type: string
      max_amount:
        description: upper bound for range quantities (e.g. "1–2 cups")
        type: number
      name:
        description: |-
          Name is the ingredient name as written in this recipe (e.g. "carrots", "all-purpose flour").
          May differ from Food.Name, which holds the deduplicated canonical form (e.g. "carrot").
        type: string
      raw_text:
        description: RawText is the original unparsed ingredient string from the source
          (e.g. "2 large carrots, diced").
        type: string
      unit:
        $ref: '#/definitions/domain.Unit'
      unit_id:
        type: string
    type: object
  domain.RecipeInstruction:
    properties:
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.Image'
        type: array
      order:
        type: integer
      parent:
        $ref: '#/definitions/domain.RecipeInstruction'
      parent_id:
        type: string
      text:
        type: string
      title:
        type: string
      url:
        type: string
      video_url:
        type: string
    type: object
  domain.RecipeNutrition:
    properties:
      calcium:
        description: The number of milligrams of calcium.
        type: number
      calories:
        description: The number of calories.
        example: 450.5
        type: number
      carbs:
        description: The number of grams of carbohydrates.
        example: 60
        type: number
      carbs_fiber:
        description: The number of grams of fiber.
        example: 4.5
        type: number
      carbs_sugar:
        description: The number of grams of sugar.
        example: 10
        type: number
      cholesterol:
        description: The number of milligrams of cholesterol.
        example: 35
        type: number
      copper:
        description: The number of milligrams of copper.
        type: number
      fat:
        description: The number of grams of fat.
        example: 15.2
        type: number
      fat_saturated:
        description: The number of grams of saturated fat.
        example: 5.1
        type: number
      fat_trans:
        description: The number of grams of trans fat.
        example: 0.1
        type: number
      iron:
        description: The number of milligrams of iron.
        type: number
      magnesium:
        description: The number of milligrams of magnesium.
        type: number
      manganese:
        description: The number of milligrams of manganese.
        type: number
      phosphorus:
        description: The number of milligrams of phosphorus.
        type: number
      potassium:
        description: The number of milligrams of potassium.
        type: number
      protein:
        description: The number of grams of protein.
        example: 22
        type: number
      salt:
        description: The number of grams of salt.
        type: number
      selenium:
        description: The number of micrograms of selenium.
        type: number
      serving_size:
        description: The serving size, in terms of the number of volume or mass.
        example: 1 plate
        type: string
      sodium:
        description: The number of milligrams of sodium.
        example: 250
        type: number
      zinc:
        description: The number of milligrams of zinc.
        type: number
    type: object
  domain.ShoppingItem:
    properties:
      amount:
        type: number
      food:
        $ref: '#/definitions/domain.Food'
      food_id:
        type: string
      id:
        type: string
      is_bought:
        type: boolean
      text:
        description: raw user input
        type: string
      unit:
        $ref: '#/definitions/domain.Unit'
      unit_id:
        type: string
    type: object
  domain.ShoppingList:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      items:
        items:
          $ref: '#/definitions/domain.ShoppingItem'
        type: array
      name:
        type: string
    type: object
  domain.Taxonomy:
    properties:
      canonical:
        $ref: '#/definitions/domain.Taxonomy'
      canonical_id:
        description: For merging/aliases
        type: string
      id:
        type: string
      label:
        type: string
      parent:
        $ref: '#/definitions/domain.Taxonomy'
      parent_id:
        type: string
      slug:
        type: string
      type:
        description: diet, category, cuisine, keyword
        type: string
    type: object
  domain.Unit:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      taxonomies:
        items:
          $ref: '#/definitions/domain.Taxonomy'
        type: array
    type: object
  domain.UploadedImage:
    properties:
      content_type:
        type: string
      height:
        type: integer
      size:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  domain.User:
    properties:
      email:
        type: string
      household_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      recipes:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
    type: object
  domain.UserToken:
    properties:
      expires:
        type: string
      id:
        type: string
      token:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  domain.Video:
    properties:
      content_url:
        type: string
      description:
        type: string
      embed_url:
        type: string
      name:
        type: string
      thumbnail_url:
        type: string
    type: object
  handlers.SuccessMessage:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  sentinels.Error:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      status:
        type: integer
    type: object
  types.ListResponse-domain_Collection:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Collection'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_Equipment:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Equipment'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_Feed:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Feed'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_MealPlan:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.MealPlan'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_Publisher:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Publisher'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_Recipe:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Recipe'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_ShoppingItem:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.ShoppingItem'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_ShoppingList:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.ShoppingList'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_Taxonomy:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Taxonomy'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.ListResponse-domain_User:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      meta:
        $ref: '#/definitions/types.Meta'
    type: object
  types.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: The backend API for Borscht app.
  license:
    name: MIT license
    url: https://opensource.org/license/mit/
  title: Smetana API
  version: "1.0"
paths:
  /_health:
    get:
      consumes:
      - '*/*'
      description: get the status of server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessMessage'
      summary: Show the status of server.
      tags:
      - root
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the given email address. Always
        returns 202 to prevent user enumeration.
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ForgotPasswordForm'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Request a password reset email.
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user by email and password, returning access and refresh
        tokens.
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/api.LoginForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Authenticate user and return tokens.
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate a refresh token, ending the session.
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: logout
        required: true
        schema:
          $ref: '#/definitions/api.RenewForm'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Logout user.
      tags:
      - auth
  /api/v1/auth/oidc/callback:
    get:
      description: Handles the callback from the identity provider, returning local
        access and refresh tokens.
      parameters:
      - description: CSRF State
        in: query
        name: state
        required: true
        type: string
      - description: Auth Code
        in: query
        name: code
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: OIDC Consumer.
      tags:
      - auth
  /api/v1/auth/oidc/login:
    get:
      description: Redirects the user to the configured OIDC provider.
      responses:
        "302":
          description: Found
      summary: OIDC Initiator.
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh tokens using a valid refresh token, returning new access
        and refresh tokens.
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/api.RenewForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Refresh tokens.
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with name, email, and password, returning access
        and refresh tokens. If invite_code is provided and valid, the user joins the
        associated household.
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/api.RegisterForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Create a new user.
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.ResetPasswordForm'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sentinels.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sentinels.Error'
      summary: Reset password using a token from email.
      tags:
      - auth
