      consumes:
        - application/json
      parameters:
        - description: Text search
          in: query
          name: q
          type: string
        - description: Comma-separated taxonomy IDs to filter by (using OR logic)
          in: query
          name: taxonomies
          type: string
        - description: Comma-separated publisher IDs to filter by
          in: query
          name: publishers
          type: string
        - description: Comma-separated author IDs to filter by
