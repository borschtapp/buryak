    post:
      consumes:
        - application/json
      description:
        Trigger an immediate synchronization of the feed, importing any
        new recipes. This call is synchronous and blocks until the sync completes.
        If the connection drops, the sync continues server-side.
      parameters:
        - description: Feed ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/sentinels.Error"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
      summary: Sync a feed
      tags:
        - feeds
  /api/v1/feeds/stream:
