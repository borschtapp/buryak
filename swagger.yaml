          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/sentinels.Error"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
      summary: Delete collection.
      tags:
        - collections
    get:
      consumes:
        - "*/*"
      parameters:
        - description: Collection ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/domain.Collection"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/sentinels.Error"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
