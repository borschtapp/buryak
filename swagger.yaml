      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/types.ListResponse-domain_Recipe"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
