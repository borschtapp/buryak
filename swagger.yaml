info:
  contact: {}
  description: The backend API for Borscht app.
  license:
    name: MIT license
    url: https://opensource.org/license/mit/
  title: Smetana API
  version: "1.0"
paths:
  /_health:
    get:
      consumes:
        - "*/*"
      description: get the status of server.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handlers.SuccessMessage"
      summary: Show the status of server.
      tags:
        - root
  /_version:
    get:
      consumes:
        - "*/*"
      description: get the current app version and latest available version from GitHub.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/handlers.versionResponse"
      summary: Show the app version.
      tags:
        - root
  /api/v1/auth/forgot-password:
    post:
      consumes:
        - application/json
      description:
        Sends a password reset link to the given email address. Always
        returns 202 to prevent user enumeration.
      parameters:
        - description: Email address
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/api.ForgotPasswordForm"
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Request a password reset email.
      tags:
        - auth
  /api/v1/auth/login:
    post:
      consumes:
        - application/json
      description:
        Authenticate user by email and password, returning access and refresh
        tokens.
      parameters:
        - description: Login credentials
          in: body
          name: login
          required: true
          schema:
            $ref: "#/definitions/api.LoginForm"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/api.AuthResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Authenticate user and return tokens.
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      consumes:
        - application/json
      description: Invalidate a refresh token, ending the session.
      parameters:
        - description: Refresh token to invalidate
          in: body
          name: logout
          required: true
          schema:
            $ref: "#/definitions/api.RenewForm"
      produces:
        - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Logout user.
      tags:
        - auth
  /api/v1/auth/oidc/callback:
    get:
      description:
        Handles the callback from the identity provider, returning local
        access and refresh tokens.
      parameters:
        - description: CSRF State
          in: query
          name: state
          required: true
          type: string
        - description: Auth Code
          in: query
          name: code
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/api.AuthResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: OIDC Consumer.
      tags:
        - auth
  /api/v1/auth/oidc/login:
    get:
      description: Redirects the user to the configured OIDC provider.
      responses:
        "302":
          description: Found
      summary: OIDC Initiator.
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      consumes:
        - application/json
      description:
        Refresh tokens using a valid refresh token, returning new access
        and refresh tokens.
      parameters:
        - description: Refresh token
          in: body
          name: refresh
          required: true
          schema:
            $ref: "#/definitions/api.RenewForm"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/api.AuthResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Refresh tokens.
      tags:
        - auth
  /api/v1/auth/register:
    post:
      consumes:
        - application/json
      description:
        Register a new user with name, email, and password, returning access
        and refresh tokens. If invite_code is provided and valid, the user joins the
        associated household.
      parameters:
        - description: User registration data
          in: body
          name: user
          required: true
          schema:
            $ref: "#/definitions/api.RegisterForm"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/api.AuthResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Create a new user.
      tags:
        - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
        - application/json
      parameters:
        - description: Reset token and new password
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/api.ResetPasswordForm"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/sentinels.Error"
      summary: Reset password using a token from email.
      tags:
        - auth
  /api/v1/authors:
    get:
      consumes:
        - "*/*"
      description: List recipe authors stored in the database.
      parameters:
        - description: Text search
          in: query
          name: q
          type: string
        - description: "Comma-separated extras to include: total_recipes"
          in: query
          name: preload
          type: string
        - description:
            "Restrict results to recipes visible in a given screen: feeds,
            saved (default: all household-visible recipes)"
          in: query
          name: scope
          type: string
        - description: "Sort by field: id, name, created, total_recipes (default: id)"
          in: query
          name: sort
          type: string
        - description: "Sort order: asc or desc (default: desc)"
          in: query
          name: order
          type: string
        - description: "Number of records to skip (default: 0)"
          in: query
          name: offset
          type: integer
        - description: "Maximum number of records to return (default: 10)"
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/types.ListResponse-domain_Author"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
      summary: List all recipe authors.
      tags:
        - authors
  /api/v1/collections:
    get:
      consumes:
        - "*/*"
      description: Returns collections associated with the user's household.
      parameters:
        - description: Text search
          in: query
          name: q
          type: string
        - description: "Comma-separated extras to include: last3_recipes and total_recipes"
          in: query
          name: preload
          type: string
        - description: "Sort by field: id, name, created, updated (default: id)"
          in: query
          name: sort
          type: string
        - description: "Sort order: asc or desc (default: desc)"
          in: query
          name: order
          type: string
        - description: "Number of records to skip (default: 0)"
          in: query
          name: offset
          type: integer
        - description: "Maximum number of records to return (default: 10)"
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/types.ListResponse-domain_Collection"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
      summary: List user's collections.
      tags:
        - collections
    post:
      consumes:
        - application/json
      description: Create a new recipe collection for the current household.
      parameters:
        - description: Collection data
          in: body
          name: collection
          required: true
          schema:
            $ref: "#/definitions/api.CollectionForm"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/domain.Collection"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/sentinels.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
