definitions:
  api.AuthResponse:
    properties:
      access_token:
        type: string
      email:
        type: string
      household_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        minLength: 2
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      refresh_token:
        type: string
    required:
      - email
      - name
    type: object
  api.CollectionForm:
    properties:
      description:
        type: string
      name:
        minLength: 2
        type: string
    required:
      - name
    type: object
  api.CreateInviteForm:
    properties:
      email:
        type: string
    type: object
  api.ForgotPasswordForm:
    properties:
      email:
        type: string
    required:
      - email
    type: object
  api.ImportRequest:
    properties:
      type:
        description: '"auto", "recipe", "feed"'
        enum:
          - auto
          - recipe
          - feed
        type: string
      update:
        type: boolean
      url:
        type: string
    required:
      - url
    type: object
  api.LoginForm:
    properties:
      email:
        minLength: 6
        type: string
      password:
        minLength: 8
        type: string
    required:
      - email
      - password
    type: object
  api.MealPlanForm:
    properties:
      date:
        example: "2024-12-25"
        format: date
        type: string
      description:
        type: string
      meal_type:
        enum:
          - breakfast
          - lunch
          - dinner
        example: dinner
        type: string
      recipe_id:
        type: string
      servings:
        example: 4
        minimum: 1
        type: integer
    required:
      - date
      - meal_type
    type: object
  api.RegisterForm:
    properties:
      email:
        minLength: 6
        type: string
      invite_code:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
      - email
      - password
    type: object
  api.RenewForm:
    properties:
      refresh_token:
        type: string
    required:
      - refresh_token
    type: object
  api.ResetPasswordForm:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
      - new_password
      - token
    type: object
  api.ShoppingItemForm:
    properties:
      amount:
        example: 2
        type: number
      food_id:
        type: string
      text:
        example: 2 cups of milk
        type: string
      unit_id:
        type: string
    type: object
  api.ShoppingListForm:
    properties:
      name:
        example: Weekly Shop
        type: string
    required:
      - name
    type: object
  api.SubscribeRequest:
    properties:
      url:
        type: string
    required:
      - url
    type: object
  api.UpdateCollectionForm:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  api.UpdateMealPlanForm:
    properties:
      date:
        example: "2024-12-26"
        format: date
        type: string
      description:
        type: string
      meal_type:
        enum:
          - breakfast
          - lunch
          - dinner
        example: lunch
        type: string
      recipe_id:
        type: string
      servings:
        example: 2
        minimum: 1
        type: integer
    type: object
  api.UpdateShoppingItemForm:
    properties:
      amount:
        example: 1
        type: number
      is_bought:
        example: true
        type: boolean
      text:
        example: Organic Milk
        type: string
    type: object
  api.UpdateUserForm:
    properties:
      current_password:
        example: password123
        type: string
      email:
        example: john@example.com
        format: email
        minLength: 6
        type: string
      name:
        example: John Doe
        minLength: 2
        type: string
      new_password:
        example: newpassword123
        minLength: 8
        type: string
    type: object
  api.mergeRequest:
    properties:
      merge_into:
        type: string
    required:
      - merge_into
    type: object
  api.recordPriceRequest:
    properties:
      amount:
        type: number
      price:
        type: number
      unit_id:
        type: string
    required:
      - amount
      - price
      - unit_id
    type: object
  api.updateFoodRequest:
    properties:
      default_unit_id:
        type: string
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      pantry:
        type: boolean
    type: object
  api.updateHouseholdForm:
    properties:
      currency:
        type: string
      name:
        minLength: 2
        type: string
    required:
      - name
    type: object
  api.updateUnitRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  domain.Author:
    properties:
      description:
        maxLength: 1000
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      total_recipes:
        type: integer
      url:
        type: string
    required:
      - name
    type: object
  domain.Collection:
    properties:
      description:
        maxLength: 1000
        type: string
      id:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      total_recipes:
        type: integer
      user_id:
        type: string
    required:
      - name
    type: object
  domain.Equipment:
    properties:
      description:
        maxLength: 1000
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: "#/definitions/domain.Image"
        type: array
      name:
        maxLength: 255
        minLength: 1
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      total_recipes:
        type: integer
    required:
      - name
      - slug
    type: object
  domain.Feed:
    properties:
      active:
        type: boolean
      description:
        maxLength: 1000
        type: string
      id:
        type: string
      last_sync_at:
        type: string
      last_sync_success:
        type: boolean
      name:
        maxLength: 255
        minLength: 2
        type: string
      publisher:
        $ref: "#/definitions/domain.Publisher"
      publisher_id:
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      total_recipes:
        type: integer
      url:
        type: string
    required:
      - name
      - url
    type: object
  domain.Food:
    properties:
      canonical_food_id:
        type: string
      default_unit:
        $ref: "#/definitions/domain.Unit"
      default_unit_id:
        type: string
      description:
        maxLength: 1000
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      pantry:
        description:
          Whether this food is always available (e.g. salt, oil) and should
          be excluded from shopping lists
        type: boolean
      slug:
        maxLength: 255
        minLength: 1
        type: string
      taxonomies:
        items:
          $ref: "#/definitions/domain.Taxonomy"
        type: array
    required:
      - name
      - slug
    type: object
  domain.FoodPrice:
    properties:
      amount:
        type: number
      created:
        type: string
      food:
        $ref: "#/definitions/domain.Food"
      food_id:
        type: string
      household_id:
        type: string
      id:
        type: string
      price:
        type: number
      unit:
        $ref: "#/definitions/domain.Unit"
      unit_id:
        type: string
    required:
      - amount
      - price
    type: object
  domain.Household:
    properties:
      collections:
        items:
          $ref: "#/definitions/domain.Collection"
        type: array
      currency:
        type: string
      feeds:
        items:
          $ref: "#/definitions/domain.Feed"
        type: array
      id:
        type: string
      invites:
        items:
          $ref: "#/definitions/domain.UserToken"
        type: array
      members:
        items:
          $ref: "#/definitions/domain.User"
        type: array
      name:
        maxLength: 255
        minLength: 2
        type: string
      owner_id:
        type: string
      shopping_lists:
        items:
          $ref: "#/definitions/domain.ShoppingList"
        type: array
    required:
      - currency
      - name
    type: object
  domain.Image:
    properties:
      caption:
        type: string
      content_type:
        type: string
      height:
        type: integer
      id:
        type: string
      order:
        type: integer
      size:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  domain.ImportResult:
    properties:
      created:
        type: boolean
      feed:
        $ref: "#/definitions/domain.Feed"
      recipe:
        $ref: "#/definitions/domain.Recipe"
    type: object
  domain.InviteInfo:
    properties:
      household_name:
        type: string
      inviter_name:
        type: string
    type: object
  domain.MealPlan:
    properties:
      date:
        type: string
      description:
        type: string
      id:
        type: string
      meal_type:
        description: breakfast, lunch, dinner
        type: string
      recipe:
        $ref: "#/definitions/domain.Recipe"
      recipe_id:
        type: string
      servings:
        type: integer
    type: object
  domain.Publisher:
    properties:
      description:
        maxLength: 1000
        type: string
      feeds:
        items:
          $ref: "#/definitions/domain.Feed"
        type: array
      id:
        type: string
      image_url:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      total_recipes:
        type: integer
      url:
        type: string
    required:
      - name
    type: object
  domain.Rating:
    properties:
      count:
        minimum: 0
        type: integer
      reviews:
        minimum: 0
        type: integer
      value:
        maximum: 5
        minimum: 0
        type: number
    type: object
  domain.Recipe:
    properties:
      author:
        $ref: "#/definitions/domain.Author"
      author_id:
        type: string
      collections:
        items:
          $ref: "#/definitions/domain.Collection"
        type: array
      cook_time:
        example: 1200
        type: integer
      description:
        example:
          A classic Italian pasta dish made with eggs, cheese, pancetta, and
          pepper.
        maxLength: 10000
        type: string
      difficulty:
        example: Medium
        type: string
      equipment:
        items:
          $ref: "#/definitions/domain.Equipment"
        type: array
      feed_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: "#/definitions/domain.Image"
        type: array
      ingredients:
        items:
          $ref: "#/definitions/domain.RecipeIngredient"
        type: array
      instructions:
        items:
          $ref: "#/definitions/domain.RecipeInstruction"
        type: array
      language:
        example: en
        type: string
      method:
        example: Stovetop
        type: string
      name:
        example: Spaghetti Carbonara
        maxLength: 255
        minLength: 2
        type: string
      nutrition:
        $ref: "#/definitions/domain.RecipeNutrition"
      prep_time:
        example: 900
        type: integer
      published:
        format: date-time
        type: string
      publisher:
        $ref: "#/definitions/domain.Publisher"
      publisher_id:
        type: string
      rating:
        $ref: "#/definitions/domain.Rating"
      saved_by:
        items:
          $ref: "#/definitions/domain.RecipeSavedUser"
        type: array
      source_url:
        type: string
      taxonomies:
        items:
          $ref: "#/definitions/domain.Taxonomy"
        type: array
      text:
        type: string
      total_time:
        example: 2100
        type: integer
      user_id:
        type: string
      video:
        $ref: "#/definitions/domain.Video"
      yield:
        example: 4
        type: integer
    required:
      - name
    type: object
  domain.RecipeCostEstimate:
    properties:
      items:
        items:
          $ref: "#/definitions/domain.RecipeIngredientCost"
        type: array
      per_serving:
        type: number
      total:
        type: number
    type: object
  domain.RecipeIngredient:
    properties:
      amount:
        description: nil when unquantified (e.g. "to taste", "a pinch of")
        type: number
      category:
        description:
          Category groups ingredients into named sections within a recipe
          (e.g. "For the sauce", "For the dough").
        maxLength: 255
        type: string
      description:
        description:
          Description holds preparation notes extracted from the ingredient
          string (e.g. "finely diced", "at room temperature").
        maxLength: 1000
        type: string
      food:
        $ref: "#/definitions/domain.Food"
      food_id:
        type: string
      id:
        type: string
      max_amount:
        description: upper bound for range quantities (e.g. "1–2 cups")
        type: number
      name:
        description: |-
          Name is the ingredient name as written in this recipe (e.g. "carrots", "all-purpose flour").
          May differ from Food.Name, which holds the deduplicated canonical form (e.g. "carrot").
        maxLength: 255
        minLength: 1
        type: string
      raw_text:
        description:
          RawText is the original unparsed ingredient string from the source
          (e.g. "2 large carrots, diced").
        type: string
      unit:
        $ref: "#/definitions/domain.Unit"
      unit_id:
        type: string
    required:
      - raw_text
    type: object
  domain.RecipeIngredientCost:
    properties:
      cost:
        description: cost for this ingredient in the recipe (nil if not calculated)
        type: number
      food_price:
        allOf:
          - $ref: "#/definitions/domain.FoodPrice"
        description: the price used (nil if not calculated)
      ingredient_id:
        description: references Recipe.Ingredients[].ID
        type: string
      status:
        description: '"calculated" | "pantry" | "missing_price" | "incompatible_unit"'
        type: string
    type: object
  domain.RecipeInstruction:
    properties:
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: "#/definitions/domain.Image"
        type: array
      order:
        minimum: 0
        type: integer
      parent:
        $ref: "#/definitions/domain.RecipeInstruction"
      parent_id:
        type: string
      text:
        type: string
      title:
        maxLength: 255
        type: string
      url:
        type: string
      video_url:
        type: string
    required:
      - text
    type: object
  domain.RecipeNutrition:
    properties:
      calcium:
        description: The number of milligrams of calcium.
        minimum: 0
        type: number
      calories:
        description: The number of calories.
        example: 450.5
        minimum: 0
        type: number
      carbs:
        description: The number of grams of carbohydrates.
        example: 60
        minimum: 0
        type: number
      carbs_fiber:
        description: The number of grams of fiber.
        example: 4.5
        minimum: 0
        type: number
      carbs_sugar:
        description: The number of grams of sugar.
        example: 10
        minimum: 0
        type: number
      cholesterol:
        description: The number of milligrams of cholesterol.
        example: 35
        minimum: 0
        type: number
      copper:
        description: The number of milligrams of copper.
        minimum: 0
        type: number
      fat:
        description: The number of grams of fat.
        example: 15.2
        minimum: 0
        type: number
      fat_saturated:
        description: The number of grams of saturated fat.
        example: 5.1
        minimum: 0
        type: number
      fat_trans:
        description: The number of grams of trans fat.
        example: 0.1
        minimum: 0
        type: number
      iron:
        description: The number of milligrams of iron.
        minimum: 0
        type: number
      magnesium:
        description: The number of milligrams of magnesium.
        minimum: 0
        type: number
      manganese:
        description: The number of milligrams of manganese.
        minimum: 0
        type: number
      phosphorus:
        description: The number of milligrams of phosphorus.
        minimum: 0
        type: number
      potassium:
        description: The number of milligrams of potassium.
        minimum: 0
        type: number
      protein:
        description: The number of grams of protein.
        example: 22
        minimum: 0
        type: number
      salt:
        description: The number of grams of salt.
        minimum: 0
        type: number
      selenium:
        description: The number of micrograms of selenium.
        minimum: 0
        type: number
      serving_size:
        description: The serving size, in terms of the number of volume or mass.
        example: 1 plate
        maxLength: 255
        type: string
      sodium:
        description: The number of milligrams of sodium.
        example: 250
        minimum: 0
        type: number
      zinc:
        description: The number of milligrams of zinc.
        minimum: 0
        type: number
    type: object
  domain.RecipeSavedUser:
    properties:
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
    type: object
  domain.ShoppingItem:
    properties:
      amount:
        type: number
      food:
        $ref: "#/definitions/domain.Food"
      food_id:
        type: string
      id:
        type: string
      is_bought:
        type: boolean
      text:
        description: raw user input
        maxLength: 255
        minLength: 1
        type: string
      unit:
        $ref: "#/definitions/domain.Unit"
      unit_id:
        type: string
    required:
      - text
    type: object
  domain.ShoppingList:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      items:
        items:
          $ref: "#/definitions/domain.ShoppingItem"
        type: array
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
      - name
    type: object
  domain.Taxonomy:
    properties:
      canonical:
        $ref: "#/definitions/domain.Taxonomy"
      canonical_id:
        description: For merging/aliases
        type: string
      id:
        type: string
      label:
        maxLength: 255
        minLength: 1
        type: string
      parent:
        $ref: "#/definitions/domain.Taxonomy"
      parent_id:
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      total_recipes:
        type: integer
      type:
        description: diet, category, cuisine, keyword
        enum:
          - diet
          - category
          - cuisine
          - keyword
        type: string
    required:
      - label
      - slug
      - type
    type: object
  domain.Unit:
    properties:
      base_factor:
        description: BaseFactor is the multiplier to convert amounts to the base unit.
        type: number
      base_unit:
        $ref: "#/definitions/domain.Unit"
      base_unit_id:
        type: string
      canonical_unit_id:
        type: string
      id:
        type: string
      imperial:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      taxonomies:
        items:
          $ref: "#/definitions/domain.Taxonomy"
        type: array
    required:
      - name
      - slug
    type: object
  domain.UploadedImage:
    properties:
      content_type:
        type: string
      height:
        type: integer
      size:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  domain.User:
    properties:
      email:
        type: string
      household_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        minLength: 2
        type: string
      recipes:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
    required:
      - email
      - name
    type: object
  domain.UserToken:
    properties:
      expires:
        type: string
      id:
        type: string
      token:
        type: string
      type:
        enum:
          - refresh
          - household_invite
          - password_reset
        type: string
      user_id:
        type: string
    required:
      - token
      - type
    type: object
  domain.Video:
    properties:
      content_url:
        type: string
      description:
        maxLength: 2000
        type: string
      embed_url:
        type: string
      name:
        minLength: 2
        type: string
      thumbnail_url:
        type: string
    type: object
  handlers.SuccessMessage:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.versionResponse:
    properties:
      current:
        type: string
    type: object
  sentinels.Error:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      status:
        type: integer
    type: object
  types.ListResponse-domain_Author:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Author"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Collection:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Collection"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Equipment:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Equipment"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Feed:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Feed"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Food:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Food"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_FoodPrice:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.FoodPrice"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_MealPlan:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.MealPlan"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Publisher:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Publisher"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_Recipe:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.Recipe"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_ShoppingItem:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.ShoppingItem"
        type: array
      meta:
        $ref: "#/definitions/types.Meta"
    type: object
  types.ListResponse-domain_ShoppingList:
    properties:
      data:
        items:
          $ref: "#/definitions/domain.ShoppingList"
        type: array
      meta:
