  /api/v1/feeds:
    get:
      consumes:
        - application/json
      description: Returns all feeds the user is subscribed to.
      parameters:
        - description: Text search
          in: query
          name: q
          type: string
        - description:
            "Comma-separated extras to include: publisher, last3_recipes
            and total_recipes"
          in: query
          name: preload
          type: string
        - description: "Sort by field: id, name, created, updated (default: id)"
          in: query
          name: sort
          type: string
        - description: "Sort order: asc or desc (default: desc)"
          in: query
          name: order
          type: string
        - description: "Number of records to skip (default: 0)"
          in: query
          name: offset
          type: integer
        - description: "Maximum number of records to return (default: 10)"
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/types.ListResponse-domain_Feed"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/sentinels.Error"
      security:
        - ApiKeyAuth: []
      summary: List subscriptions
